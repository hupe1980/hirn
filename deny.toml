[advisories]
ignore = [
    { id = "RUSTSEC-2026-0044", reason = "aws-lc-sys 0.38 pinned by transitive deps; awaiting upstream update" },
    { id = "RUSTSEC-2026-0048", reason = "aws-lc-sys 0.38 pinned by transitive deps; awaiting upstream update" },
    { id = "RUSTSEC-2023-0071", reason = "rsa crate Marvin attack — hirn does not perform RSA decryption" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — transitive dep, no replacement available" },
    { id = "RUSTSEC-2025-0134", reason = "bincode unmaintained — used by openraft, no replacement available" },
    { id = "RUSTSEC-2025-0141", reason = "rustls-pemfile unmaintained — transitive dep, no replacement available" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic parse DoS — reachable only via reqsign→opendal cloud-signing XML from configured (trusted) cloud endpoints; fix needs quick-xml 0.41, blocked by lance =4.0.0's reqsign pin; revisit on the next lance upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml namespace-alloc DoS — same reqsign→opendal path and same lance-pinned blocker as RUSTSEC-2026-0194; revisit on the next lance upgrade" },
    { id = "RUSTSEC-2026-0189", reason = "rmcp <1.4 DNS-rebinding (no Host validation). Real exposure is limited to hosts running the MCP listener while a local browser visits a hostile page; MCP is off unless configured, binds loopback by default, and docs mandate a validating reverse proxy for anything beyond local dev. Proper fix is the rmcp 0.1→2.x migration of hirnd::mcp — tracked as the next dependency task" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
