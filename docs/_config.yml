# ── Site metadata (SEO) ──────────────────────────────────────────────────
title: hirn
description: >-
  hirn — a cognitive memory engine for AI agents. Graph-native, biologically
  inspired long-term memory with spreading activation, temporal indexing,
  Hebbian plasticity, and consolidation as database primitives. Embeddable,
  local-first, written in Rust.
tagline: The brain an LLM never had
url: https://hupe1980.github.io
baseurl: /hirn
lang: en

author:
  name: hirn contributors

# ── Theme (Just the Docs, current release) ───────────────────────────────
# Built via GitHub Actions with a Gemfile so we run current Jekyll 4 + the
# latest Just the Docs, rather than the legacy github-pages gem (Jekyll 3.9).
theme: just-the-docs

# ── Navigation & search ──────────────────────────────────────────────────
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false
  focus_shortcut_key: k

nav_enabled: true
nav_sort: case_insensitive
heading_anchors: true

# External / auxiliary links shown top-right.
aux_links:
  "GitHub":
    - "https://github.com/hupe1980/hirn"
aux_links_new_tab: true

# ── Appearance ───────────────────────────────────────────────────────────
color_scheme: dark
logo: "/assets/images/logo.svg"
# The favicon is emitted via _includes/head_custom.html (SVG, not .ico).

# Enable copy button on code blocks + collapsible ToC.
enable_copy_code_button: true

# ── Mermaid diagrams (native Just the Docs support) ──────────────────────
mermaid:
  version: "11.4.1"

# ── "Edit this page on GitHub" + timestamps ──────────────────────────────
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/hupe1980/hirn"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# ── Callouts / admonitions ───────────────────────────────────────────────
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: yellow
  danger:
    title: Danger
    color: red
  experimental:
    title: Experimental
    color: grey-dk

# ── Footer ───────────────────────────────────────────────────────────────
footer_content: >-
  hirn is licensed under Apache-2.0. This project is experimental — APIs,
  on-disk formats, and behaviour may change without notice.
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# ── Plugins (SEO, sitemap, relative links) ───────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

# jekyll-relative-links: rewrite `[x](file.md)` cross-links to built URLs.
relative_links:
  enabled: true
  collections: false

# ── Build ────────────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - node_modules
  - README.md

# Clean, extension-less URLs.
permalink: pretty

# Compress HTML output.
sass:
  style: compressed
