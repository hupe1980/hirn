<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="hirn — the brain an LLM never had">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e14"/>
      <stop offset="0.6" stop-color="#12131a"/>
      <stop offset="1" stop-color="#1a1330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#b28bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Synapse motif: nodes joined by weighted edges. -->
  <g stroke="#7c9cff" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M905 214 L1010 168 M905 214 L1012 268 M905 214 L982 330 M1010 168 L1012 268 M1012 268 L982 330"/>
  </g>
  <g fill="url(#ink)">
    <circle cx="905" cy="214" r="15"/>
    <circle cx="1010" cy="168" r="9"/>
    <circle cx="1012" cy="268" r="11"/>
    <circle cx="982" cy="330" r="7"/>
  </g>

  <text x="88" y="212" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" letter-spacing="6" fill="#7c9cff" font-weight="600">COGNITIVE MEMORY ENGINE</text>

  <text x="88" y="316" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" fill="#e6e8f0" letter-spacing="-3">hirn</text>

  <text x="88" y="396" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="600" fill="#e6e8f0">The brain an LLM never had</text>

  <text x="88" y="462" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="27" fill="#a3a8bd">Persistent, structured memory for AI agents — graph-native recall,</text>
  <text x="88" y="502" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="27" fill="#a3a8bd">symbolic temporal reasoning, consolidation. Embeddable. Rust.</text>

  <rect x="88" y="546" width="188" height="44" rx="10" fill="#7c9cff"/>
  <text x="182" y="575" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700" fill="#0d0e14">Apache-2.0</text>
  <text x="300" y="575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" fill="#767c94">github.com/hupe1980/hirn</text>
</svg>
