name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, enables the fuzz smoke job
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Without this
# a rapid series of pushes runs every one of them to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: "0"
  # CI never runs a debugger; full debug info costs build time and cache size.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Fail fast on a network hiccup rather than hanging the job.
  CARGO_NET_RETRY: "3"

jobs:
  docs-link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.1"
    steps:
      - uses: actions/checkout@v4

      # Cross-file links and anchors in every checked-in markdown file. The
      # script fails on a path that does not exist, so a renamed directory
      # breaks the build instead of quietly reducing coverage to nothing.
      - name: Check markdown links
        run: |
          python3 scripts/check_markdown_links.py \
            README.md CONTRIBUTING.md FINDINGS.md \
            site bench-results crates .github

      # Heading anchors inside the site are left to Zola, which slugifies them
      # exactly as the renderer does; reimplementing that in the script would
      # drift and start reporting working links as broken.
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola

      - name: Check site links and anchors
        working-directory: site
        run: zola check --skip-external-links

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check --all
      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs tests in parallel across processes; on CI hardware that is
      # worth roughly 40% off the wall clock for a suite this size. It does not
      # run doctests, which is why the explicit doctest step below stays.
      - name: Test
        run: cargo nextest run --workspace --profile ci
      # --lib/--bins/--tests skips doctests, so run them explicitly. Feature-
      # gated doc examples (e.g. hirn-provider) are covered by the explicit
      # provider-features test step below.
      - name: Doctests
        run: cargo test --workspace --doc
      # hirn-provider has default = [], so the feature-gated provider modules
      # are invisible to the workspace-wide runs above and must be built and
      # tested explicitly. cross-encoder is left out because it pulls in the
      # ONNX runtime, which is too heavy for CI.
      - name: Clippy (provider features)
        if: runner.os == 'Linux'
        run: cargo clippy -p hirn-provider --all-targets --features openai,anthropic,cohere,voyage,ollama
      - name: Test (provider features)
        run: cargo nextest run -p hirn-provider --profile ci --features openai,anthropic,cohere,voyage,ollama

  # Python and Node were one sequential job that ran for over half an hour.
  # They share no build artifacts (different crates, different profiles), so
  # running them in parallel halves the wall clock for the same work.
  python-bindings:
    name: Bindings (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-bindings
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # maturin develop requires an active virtualenv; export it for later steps.
      - name: Set up Python venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install Python tooling
        run: pip install maturin pytest numpy
      - name: Build Python bindings
        run: maturin develop --manifest-path crates/hirn-python/Cargo.toml
      - name: Test Python bindings
        run: pytest crates/hirn-python/tests

  node-bindings:
    name: Bindings (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: node-bindings
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm test` runs a debug build via the pretest hook. A release build of
      # the Lance/DataFusion tree took most of this job's half hour and buys
      # nothing: these tests check that the module loads and behaves, not how
      # fast it runs. release.yml still builds optimised artifacts.
      - name: Build and test Node bindings
        working-directory: crates/hirn-node
        run: |
          npm install
          npm test

  msrv:
    name: MSRV (1.91.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h
      # Pin the exact patch release: aws-types 1.3.14 requires rustc 1.91.1,
      # so 1.91.0 fails dependency resolution.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check (rust-version floor)
        run: cargo check --workspace

  # Build-only smoke test for the fuzz targets. Nightly + scheduled/dispatch
  # only, to keep PR CI fast.
  fuzz-smoke:
    name: Fuzz Build Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build

  # Advisories, licences, bans, and sources in one job. These were two jobs,
  # each spending several minutes compiling cargo-deny from source; the
  # prebuilt binary makes the whole check faster than either install was.
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check advisories, licences, bans, sources
        run: cargo deny check advisories licenses bans sources